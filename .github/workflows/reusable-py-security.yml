name: Reusable Python Security

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.13"
      bandit-target:
        description: "Directory or path for bandit to scan recursively"
        required: false
        type: string
        default: "src"

permissions:
  contents: read

jobs:
  py-security:
    name: Python Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        run: uv python install ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pip-audit
        run: uv run pip-audit

      - name: Run bandit
        env:
          BANDIT_TARGET: ${{ inputs.bandit-target }}
        run: uv run bandit -r "$BANDIT_TARGET" -ll
