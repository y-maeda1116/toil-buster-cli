name: OpenSSF Scorecard

# 自リポジトリのサプライチェーンセキュリティ姿勢を週次でスコア化する。
# レポート専用で、スコア低下でCIを赤くしない (Dependabot + ダッシュボード監視の運用)。
# 結果は公開API (api.securityscorecards.dev) に公開され、README の badge になる。

on:
  schedule:
    - cron: '37 20 * * 1' # 毎週月曜 20:37 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: openssf-scorecard
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # SARIF を GitHub Security タブにアップロードするため
      security-events: write
      # publish_results: true に必要
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # パブリックリポジトリのみ。結果が公開スコアAPIに反映され badge が使える。
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          sarif_file: results.sarif
